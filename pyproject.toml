[project]
name = "aog-mcp-server"
version = "0.1.0"
description = "MCP server for AOG (Aircraft On Ground) triage: aircraft alert history and hangar spare-part inventory lookups."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]<2",
]

[project.scripts]
aog-mcp-server = "aog_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aog_mcp_server"]
artifacts = ["src/aog_mcp_server/data/*.json"]
